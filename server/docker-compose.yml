services:
  xiaozhi:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiaozhi-server:dev
    environment:
      TZ: America/Santiago
      LAN_IP: ${LAN_IP:?LAN_IP must be set}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      MQTTUDP_ENABLED: ${MQTTUDP_ENABLED:-false}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      # El MCP por stdio hereda esta env (mcp-go mezcla os.Environ()).
      RESUMEN_HORA: ${RESUMEN_HORA:-}
      RECORDATORIOS_STATE: /data/recordatorios-state.json
    volumes:
      - recordatorios-state:/data
    ports:
      # LAN-only: fail instead of silently binding 0.0.0.0 when LAN_IP is unset
      - "${LAN_IP:?LAN_IP must be set}:8100:8000"
      - "${LAN_IP:?LAN_IP must be set}:8180:8080"
    extra_hosts:
      - "openspeech.bytedance.com:0.0.0.0"
      - "open.bigmodel.cn:0.0.0.0"
      - "speech.platform.bing.com:0.0.0.0"
    depends_on:
      speaches:
        condition: service_healthy
      litellm:
        condition: service_healthy
    networks:
      - xiaozhi-net
    restart: unless-stopped

  mqtt-gateway:
    build: ./mqtt-gateway
    image: mqtt-gateway:dev
    environment:
      PUBLIC_IP: ${LAN_IP:?LAN_IP must be set}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      PUSH_TOKEN: ${PUSH_TOKEN:-}
    ports:
      # LAN-only. The push port (8007) is internal and is NOT published.
      - "${LAN_IP:?LAN_IP must be set}:1883:1883/tcp"
      - "${LAN_IP:?LAN_IP must be set}:8884:8884/udp"
    depends_on:
      - xiaozhi
    networks:
      - xiaozhi-net
    restart: unless-stopped

  recordatorios:
    # Misma imagen que xiaozhi; solo cambia el entrypoint (scheduler de avisos).
    image: xiaozhi-server:dev
    entrypoint: ["/app/nextcloud-mcp", "scheduler"]
    environment:
      TZ: America/Santiago
      NEXTCLOUD_URL: ${NEXTCLOUD_URL:-}
      NEXTCLOUD_USER: ${NEXTCLOUD_USER:-}
      NEXTCLOUD_PASSWORD: ${NEXTCLOUD_PASSWORD:-}
      PUSH_URL: http://mqtt-gateway:8007/push
      PUSH_TOKEN: ${PUSH_TOKEN:-}
      RECORDATORIOS_MAC: ${RECORDATORIOS_MAC:-}
      RESUMEN_HORA: ${RESUMEN_HORA:-}
      RECORDATORIOS_STATE: /data/recordatorios-state.json
    volumes:
      - recordatorios-state:/data
    depends_on:
      - mqtt-gateway
    networks:
      - xiaozhi-net
    restart: unless-stopped

  speaches:
    build:
      context: ./speaches
    image: xiaozhi-speaches:dev
    environment:
      WHISPER__COMPUTE_TYPE: int8
      STT_MODEL_TTL: "-1"
      TTS_MODEL_TTL: "-1"
      LOG_LEVEL: info
      HF_HUB_DISABLE_TELEMETRY: "1"
    cpus: "4"
    volumes:
      - speaches-models:/home/ubuntu/.cache/huggingface/hub
    healthcheck:
      # Healthy only once BOTH preloaded models are installed (listed by /v1/models).
      test:
        - CMD-SHELL
        - >-
          curl -fsS http://localhost:8000/v1/models > /tmp/models.json
          && grep -q 'Systran/faster-whisper-small' /tmp/models.json
          && grep -q 'speaches-ai/piper-es_MX-claude-high' /tmp/models.json
      interval: 15s
      timeout: 5s
      retries: 10
      # First boot downloads ~500 MB of models; failures here don't count.
      start_period: 600s
    networks:
      - xiaozhi-net
    restart: unless-stopped

  litellm:
    build:
      context: ./litellm
    image: xiaozhi-litellm:dev
    command: ["--port", "4000", "--config", "/app/litellm-config.yaml"]
    environment:
      DATABASE_URL: postgresql://litellm:${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}@litellm-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?DEEPSEEK_API_KEY must be set}
      STORE_MODEL_IN_DB: "False"
      LITELLM_TELEMETRY_DISABLED: "true"
    ports:
      - "${LAN_IP:?LAN_IP must be set}:8140:4000"
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - xiaozhi-net
    restart: unless-stopped

  litellm-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: litellm
      POSTGRES_DB: litellm
      POSTGRES_PASSWORD: ${LITELLM_DB_PASSWORD:?LITELLM_DB_PASSWORD must be set}
    volumes:
      - litellm-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - xiaozhi-net
    restart: unless-stopped

volumes:
  speaches-models:
  litellm-db-data:
  recordatorios-state:

networks:
  xiaozhi-net:
